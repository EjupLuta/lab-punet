<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punët në Lab</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 10px; }
    h1 { text-align: center; font-size: clamp(1.8rem, 4vw, 3rem); margin-bottom: 10px; color: #1a73e8; }
    .add-form { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    input { padding: 12px; font-size: 1.1rem; border: 1px solid #ddd; border-radius: 8px; }
    button { padding: 12px 18px; font-size: 1.1rem; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn-add { background: #1a73e8; color: white; }
    .btn-edit { background: #f9ab00; color: white; }
    .btn-cancel { background: #666; color: white; }
    .btn-done { background: #34a853; color: white; }
    .table-container {
      max-height: 65vh;
      overflow-y: auto;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      background: white;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 10px; text-align: left; font-size: clamp(0.95rem, 1.8vw, 1.3rem); }
    th { background: #1a73e8; color: white; position: sticky; top: 0; }
    tr:nth-child(even) { background: #f9f9f9; }
    tr { cursor: pointer; }
    tr:hover { background: #e8f0fe; }
    .actions { display: none; gap: 8px; }
    tr.selected .actions { display: flex; flex-wrap: wrap; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; padding: 0 5px; }
    #todayDate { font-size: 1.2rem; font-weight: bold; color: #333; }
    #status { font-size: 1.1rem; color: #555; }
  </style>
</head>
<body>
  <h1>Punët Aktive në Lab</h1>
  <div class="top-bar">
    <div id="todayDate"></div>
    <div id="status">Duke ngarkuar...</div>
    <div style="width:120px;"></div>
  </div>
  <div class="add-form">
    <input type="text" id="data" placeholder="dd/mm/yy">
    <input type="text" id="doktorri" placeholder="Doktorri">
    <input type="text" id="pacienti" placeholder="Pacienti">
    <input type="text" id="Dorezimi" placeholder="Dorëzimi">
    <button class="btn-add" id="btnAdd" onclick="addJob()">Shto</button>
  </div>
  <div class="table-container" id="tableContainer">
    <table>
      <thead>
        <tr>
          <th>Data e pranimit</th>
          <th>Doktorri</th>
          <th>Pacienti</th>
          <th>Dorëzimi</th>
          <th>Veprime</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXOZz-NBR-G04DoPrGQlM54jk5s-PNvUrG-jel8n6ABLalx5uFX5hcYtuBIgvRrCRZ4A/exec";
    let jobs = [];
    let selectedId = null;
    let editing = false;
    let scrollInterval;

    function loadJobs() {
      document.getElementById("status").textContent = "Duke ngarkuar...";
      fetch(SCRIPT_URL + "?action=get")
        .then(r => r.json())
        .then(result => {
          jobs = result || [];
          render();
          document.getElementById("status").textContent = jobs.length + " punë aktive";
          showDate();
          startAutoScroll();
        })
        .catch(() => {
          document.getElementById("status").textContent = "Gabim në ngarkim";
        });
    }

    function showDate() {
      const today = new Date();
      const dd = String(today.getDate()).padStart(2, '0');
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const yyyy = today.getFullYear();
      const days = ['e diel', 'e hënë', 'e martë', 'e mërkurë', 'e enjte', 'e premte', 'e shtunë'];
      document.getElementById("todayDate").textContent = `${dd}/${mm}/${yyyy} ${days[today.getDay()]}`;
    }

    function render() {
      const tbody = document.getElementById("tbody");
      tbody.innerHTML = "";
      jobs.forEach(job => {
        const tr = document.createElement("tr");
        if (selectedId === job.id) tr.classList.add("selected");
        tr.onclick = () => selectJob(job.id);
        tr.innerHTML = `
          <td>${job.data || ""}</td>
          <td>${job.doktorri || ""}</td>
          <td>${job.pacienti || ""}</td>
          <td>${job.Dorezimi || ""}</td>
          <td>
            <div class="actions">
              <button class="btn-edit" onclick="event.stopPropagation(); startEdit('${job.id}')">Edit</button>
              <button class="btn-cancel" onclick="event.stopPropagation(); cancelEdit()">Cancel</button>
              <button class="btn-done" onclick="event.stopPropagation(); deleteJob('${job.id}')">Dorëzuar</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function startAutoScroll() {
      clearInterval(scrollInterval);
      const container = document.getElementById("tableContainer");
      if (container.scrollHeight <= container.clientHeight) return;

      scrollInterval = setInterval(() => {
        container.scrollTop += 1;
        if (container.scrollTop + container.clientHeight >= container.scrollHeight - 2) {
          container.scrollTop = 0;
        }
      }, 40);
    }

    function selectJob(id) {
      selectedId = selectedId === id ? null : id;
      render();
    }

    function addJob() {
      const data = document.getElementById("data").value.trim();
      const doktorri = document.getElementById("doktorri").value.trim();
      const pacienti = document.getElementById("pacienti").value.trim();
      const Dorezimi = document.getElementById("Dorezimi").value.trim();
      if (!doktorri || !pacienti) { alert("Plotëso Doktorrin dhe Pacientin"); return; }

      const payload = editing && selectedId
        ? { action: "update", id: selectedId, data, doktorri, pacienti, Dorezimi }
        : { action: "add", data, doktorri, pacienti, Dorezimi };

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      }).then(() => {
        clearForm();
        editing = false;
        document.getElementById("btnAdd").textContent = "Shto";
        selectedId = null;
        loadJobs();
      });
    }

    function startEdit(id) {
      const job = jobs.find(j => j.id === id);
      if (!job) return;
      document.getElementById("data").value = job.data || "";
      document.getElementById("doktorri").value = job.doktorri || "";
      document.getElementById("pacienti").value = job.pacienti || "";
      document.getElementById("Dorezimi").value = job.Dorezimi || "";
      selectedId = id;
      editing = true;
      document.getElementById("btnAdd").textContent = "Ruaj Ndryshimet";
    }

    function cancelEdit() {
      selectedId = null;
      editing = false;
      clearForm();
      document.getElementById("btnAdd").textContent = "Shto";
      render();
    }

    function deleteJob(id) {
      if (!confirm("A je i sigurt që e dorëzove këtë punë?")) return;
      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "delete", id })
      }).then(() => {
        selectedId = null;
        loadJobs();
      });
    }

    function clearForm() {
      document.getElementById("data").value = "";
      document.getElementById("doktorri").value = "";
      document.getElementById("pacienti").value = "";
      document.getElementById("Dorezimi").value = "";
    }

    loadJobs();
    setInterval(loadJobs, 60000);
  </script>
</body>
</html>
